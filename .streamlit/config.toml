# Tema de ColombiaInvest.
# El color primario de Streamlit por defecto es un rojo anaranjado (#FF4B4B)
# que aparecia en radios, deslizadores, casillas y en las etiquetas del
# selector multiple de la seccion Comparar. Se reemplaza por el azul
# institucional de GOV.CO para que no quede ningun elemento fuera de paleta.

[theme]
base = "light"
primaryColor = "#0B4EC8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F4"
textColor = "#1A1A1A"
font = "sans serif"

# La rejilla de datos se dibuja en un canvas y no lee variables CSS: su tema
# lo arma Streamlit desde estas opciones. Por eso los encabezados salian
# grises pese al CSS. Se les da el mismo azul claro del resto del tablero.
dataframeHeaderBackgroundColor = "#E4EDFA"
dataframeBorderColor = "#C3D4EC"

[server]
headless = true

[browser]
gatherUsageStats = false
